<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY MODERNIZE SAVE TECHNOLOGY LTD - Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .page { display: none; }
    .page.active { display: block; }
    
    @media print {
      .no-print, nav, button, .card-header, form, .input-group, .modal, .sales-filter-container, .returns-filter-container, .sup-filter-container, .req-filter-container { display: none !important; }
      body { font-size: 11pt; background-color: #fff !important; }
      .container { max-width: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card { border: none !important; box-shadow: none !important; }
      .table { width: 100% !important; border-collapse: collapse !important; }
      .table th, .table td { border: 1px solid #000 !important; padding: 6px !important; }
      .print-title { display: block !important; text-align: center; margin-bottom: 20px; }
      .cac-print-section { display: block !important; border: 2px solid #000; padding: 15px; margin-top: 20px; }
    }
    .print-title { display: none; }
    .cac-print-section { display: none; }
  </style>
</head>
<body class="bg-light">

  <nav id="main-nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print" style="display: none;">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">SKY MODERNIZE SAVE TECHNOLOGY LTD</a>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('dashboard')">Dashboard</button>
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('stock')">Stock 🔒</button>
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('sales')">Sales</button>
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('cash-drawer')">Cash Drawer 💵</button>
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('returns')">Customer Returns</button>
        <button class="btn btn-sm btn-outline-warning" onclick="navigateTo('supplier-returns')">Supplier Returns 📦</button>
        <button class="btn btn-sm btn-outline-info" onclick="navigateTo('purchase-requisition')">Purchase Requisition 📋</button>
        <a class="btn btn-sm btn-outline-light" href="/payments.html">Payments 💳</a>
        <button class="btn btn-sm btn-outline-light" onclick="navigateTo('change-password')">Password 🔑</button>
        <button class="btn btn-sm btn-danger ms-2" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">

    <div id="page-login" class="page active">
      <div class="row justify-content-center mt-5">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card bg-dark text-white shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
              <h3 class="text-center mb-2">SKY MODERNIZE SAVE TECHNOLOGY LTD</h3>
              <p class="text-center text-secondary mb-4">Inventory Management System</p>
              
              <div id="login-alert" class="alert alert-danger py-2 d-none" role="alert"></div>

              <form id="login-form">
                <div class="mb-3">
                  <input id="login-username" class="form-control bg-secondary text-white border-0" placeholder="Username" required>
                </div>
                <div class="mb-3">
                  <input id="login-password" type="password" class="form-control bg-secondary text-white border-0" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- existing pages... (omitted for brevity in this commit) -->

    <!-- PAYMENTS PAGE (embedded) -->
    <div id="page-payments" class="page">
      <h3>Payments</h3>
      <div>
        <label>Auto-refresh:
          <select id="payments-interval">
            <option value="0">Off</option>
            <option value="10000">10s</option>
            <option value="30000">30s</option>
            <option value="60000">1m</option>
          </select>
        </label>
        <button id="payments-refresh" class="btn btn-sm btn-outline-primary">Refresh now</button>
      </div>

      <div class="table-responsive mt-3">
        <table id="paymentsTable" class="table table-striped">
          <thead>
            <tr><th>ID</th><th>Amount</th><th>Currency</th><th>Status</th><th>Payer</th><th>Received At</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="modal fade" id="editStockModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">Edit Stock Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-stock-form">
          <div class="modal-body">
            <input type="hidden" id="edit-stk-index">
            <div class="mb-2">
              <label class="form-label">Model</label>
              <input id="edit-stk-model" class="form-control" required>
            </div>
            <!-- ... -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // --- AUTHENTICATION ---
    const AUTH_KEY = "sky_modernize_auth";
    let auth = JSON.parse(localStorage.getItem(AUTH_KEY)) || { username: "admin", password: "1234" };

    function saveAuth() { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }

    const MANAGER_PIN = "2468";

    // --- STATE MANAGEMENT ---
    let isLoggedIn = false;
    let isManagerUnlocked = false;

    // simple navigateTo implementation (if not present)
    function navigateTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const el = document.getElementById('page-' + pageId);
      if (el) el.classList.add('active');
      // show nav only when logged in
      const nav = document.getElementById('main-nav');
      if (isLoggedIn) nav.style.display = 'block'; else nav.style.display = 'none';
      // if navigating to payments, load data
      if (pageId === 'payments') loadPayments();
    }

    function logout() {
      isLoggedIn = false;
      localStorage.removeItem('isLoggedIn');
      navigateTo('login');
    }

    // login form handling
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      const stored = JSON.parse(localStorage.getItem(AUTH_KEY)) || { username: 'admin', password: '1234' };
      if (u === stored.username && p === stored.password) {
        isLoggedIn = true;
        localStorage.setItem('isLoggedIn', '1');
        document.getElementById('login-alert').classList.add('d-none');
        document.getElementById('main-nav').style.display = 'block';
        navigateTo('dashboard');
      } else {
        const a = document.getElementById('login-alert');
        a.textContent = 'Invalid credentials';
        a.classList.remove('d-none');
      }
    });

    // --- Payments logic ---
    async function loadPayments() {
      // ensure logged in
      if (!isLoggedIn) return navigateTo('login');
      const tableBody = document.querySelector('#page-payments table tbody');
      tableBody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
      try {
        const res = await fetch('/.netlify/functions/get-payments?limit=200');
        if (!res.ok) {
          tableBody.innerHTML = `<tr><td colspan="6">Error fetching payments (${res.status})</td></tr>`;
          return;
        }
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6">No payments recorded yet</td></tr>';
          return;
        }
        tableBody.innerHTML = '';
        for (const r of rows) {
          const tr = document.createElement('tr');
          const amount = (typeof r.amount === 'number') ? (r.amount/100).toFixed(2) : r.amount;
          tr.innerHTML = `
            <td>${escapeHtml(r.id)}</td>
            <td>${amount}</td>
            <td>${escapeHtml(r.currency || '')}</td>
            <td><span class="badge ${escapeHtml((r.status||'').toLowerCase())}">${escapeHtml(r.status)}</span></td>
            <td><pre style="margin:0">${escapeHtml(JSON.stringify(r.payer || ''))}</pre></td>
            <td>${new Date(r.created_at).toLocaleString()}</td>
          `;
          tableBody.appendChild(tr);
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="6">Error: ${escapeHtml(err.message || String(err))}</td></tr>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>\\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('payments-refresh').addEventListener('click', loadPayments);
    document.getElementById('payments-interval').addEventListener('change', (e) => {
      const ms = Number(e.target.value);
      if (window._paymentsTimer) clearInterval(window._paymentsTimer);
      if (ms > 0) window._paymentsTimer = setInterval(loadPayments, ms);
    });

    // initialize UI from stored state
    if (localStorage.getItem('isLoggedIn')) {
      isLoggedIn = true;
      document.getElementById('main-nav').style.display = 'block';
      navigateTo('dashboard');
    } else {
      navigateTo('login');
    }
  </script>
</body>
</html>
