<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payments — Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .badge { padding: 4px 8px; border-radius: 4px; color: white; }
    .success { background: green; } .failed { background: red; } .pending { background: orange; }
    .topbar { display:flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="btn btn-sm btn-outline-secondary">← Home</a>
    <h4 style="margin:0 8px">Payments — Moniepoint (Admin)</h4>
    <div style="flex:1"></div>
    <button id="refresh" class="btn btn-sm btn-primary">Refresh</button>
  </div>

  <table id="paymentsTable" class="table table-striped mt-3">
    <thead>
      <tr><th>ID</th><th>Amount</th><th>Currency</th><th>Status</th><th>Payer</th><th>Received At</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function fetchPayments() {
      const tbody = document.querySelector('#paymentsTable tbody');
      tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
      try {
        const res = await fetch('/.netlify/functions/get-payments?limit=500');
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="6">Error fetching payments (${res.status})</td></tr>`;
          return;
        }
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No payments recorded yet</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        for (const r of rows) {
          const tr = document.createElement('tr');
          const amount = (typeof r.amount === 'number') ? (r.amount/100).toFixed(2) : r.amount;
          const statusClass = (r.status||'').toLowerCase();
          tr.innerHTML = `
            <td>${escapeHtml(r.id)}</td>
            <td>${amount}</td>
            <td>${escapeHtml(r.currency||'')}</td>
            <td><span class="badge ${escapeHtml(statusClass)}">${escapeHtml(r.status)}</span></td>
            <td><pre style="margin:0">${escapeHtml(JSON.stringify(r.payer||''))}</pre></td>
            <td>${new Date(r.created_at).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6">Error: ${escapeHtml(err.message||String(err))}</td></tr>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('refresh').addEventListener('click', fetchPayments);
    fetchPayments();
  </script>
</body>
</html>
